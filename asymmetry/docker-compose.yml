services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: asymmetry
      POSTGRES_PASSWORD: asymmetry
      POSTGRES_DB: asymmetry
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asymmetry"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
